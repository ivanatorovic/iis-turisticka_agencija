<button class="menu-btn" (click)="toggleMenu()">
  <span></span>
  <span></span>
  <span></span>
</button>

<div
  class="menu-backdrop"
  *ngIf="menuOpen"
  (click)="closeMenu()"
></div>

<aside
  class="side-menu"
  [class.open]="menuOpen"
>

  <div class="menu-header">

    <div class="profile-avatar">
      {{ getUsername().charAt(0).toUpperCase() }}
    </div>

    <div>
      <p>Dobrodošli</p>
      <h3>{{ getUsername() }}</h3>
    </div>

  </div>

  <div class="menu-links">

    <!-- POČETNA -->

    <a
      class="home-link"
      routerLink="/"
      (click)="closeMenu()"
    >
      Početna stranica
    </a>

    <!-- PRETRAGA -->

    <a
      routerLink="/arrangements"
      *ngIf="isCustomer() || isSalesAgent()"
      (click)="closeMenu()"
    >
      Pretraga aranžmana
    </a>

    <!-- CUSTOMER -->

    <a
      routerLink="/reservations"
      *ngIf="isCustomer()"
      (click)="closeMenu()"
    >
      Moje rezervacije
    </a>

    <!-- SALES AGENT -->

    <a
      routerLink="/reservations"
      *ngIf="isSalesAgent()"
      (click)="closeMenu()"
    >
      Sve rezervacije
    </a>

    <!-- MANAGER -->

    <a
      routerLink="/sales-analytics"
      *ngIf="isManager()"
      (click)="closeMenu()"
    >
      Analitika prodaje
    </a>

    <!-- SVI -->

    <a
      routerLink="/my-profile"
      (click)="closeMenu()"
    >
      Moj profil
    </a>

  </div>

  <button
    class="menu-logout"
    (click)="logout()"
  >
    Odjava
  </button>

</aside>
