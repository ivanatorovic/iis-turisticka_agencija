services:

  postgres:
    image: postgres:15
    container_name: turisticka-agencija-db
    restart: always

    environment:
      POSTGRES_DB: turisticka_agencija
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lozinka123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: turisticka-agencija-pgadmin
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data: